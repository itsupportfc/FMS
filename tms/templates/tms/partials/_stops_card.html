<div class="card">
    <h3 class="card-header">Stops</h3>

    {% if load.stops.all %}
        <ul class="info-list">
            {% for s in load.stops.all|dictsort:"sequence" %}
                {% include "tms/partials/_stop_card_item.html" %}

            {% endfor %}
        </ul>
    {% else %}
        <p class="helper-text italic">No stops defined.</p>
    {% endif %}
</div>
