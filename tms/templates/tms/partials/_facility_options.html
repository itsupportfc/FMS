{% for facility in facilities %}
    <div class="facility-option px-3 py-2 text-sm text-gray-800 cursor-pointer hover:bg-gray-100 last:border-b-0"
         data-id="{{ facility.id }}"
         data-name="{{ facility.name }}">
        <div class="font-semibold">{{ facility.name }}</div>
        <div class="text-xs text-gray-600">{{ facility.city }}</div>
    </div>
{% empty %}
    <div class="text-gray-500 text-sm p-2">No facilities found.</div>
{% endfor %}
